openapi: 3.0.3
info:
  title: Self-Hardening Governance — Adjudication API (Demo)
  description: |
    Phase 11D/12B thin HTTP façade over the Governor adjudication path.
    **Demo only — no authentication.** LOOSEN/DISABLE never auto-approve.
  version: "0.1.0"
servers:
  - url: http://127.0.0.1:8765
    description: Local demo server (`python scripts/adjudication_server.py`)
paths:
  /health:
    get:
      summary: Health and governor status counters
      responses:
        "200":
          description: OK
  /proposals/pending:
    get:
      summary: List proposals awaiting operator decision
      responses:
        "200":
          description: Pending proposals
  /proposals/{id}/evidence:
    get:
      summary: Evidence pack for offline audit
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Evidence pack
        "404":
          description: Unknown proposal
  /proposals/{id}/decide:
    post:
      summary: Operator decision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, operator_id]
              properties:
                decision:
                  type: string
                  enum: [approve_loosen, approve_disable, reject, approve]
                operator_id: { type: string }
                rationale: { type: string }
      responses:
        "200":
          description: Decision applied
        "400":
          description: Invalid decision or state
  /boundaries:
    post:
      summary: Create boundary (demo)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                boundary_id: { type: string }
                initial_limit: { type: number }
                resource: { type: string }
      responses:
        "200":
          description: Created
  /proposals/loosen:
    post:
      summary: Create LOOSEN proposal and submit for review
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [boundary_id, proposed_value]
              properties:
                boundary_id: { type: string }
                proposed_value: { type: number }
                reason: { type: string }
      responses:
        "200":
          description: Proposal id and pending_review status

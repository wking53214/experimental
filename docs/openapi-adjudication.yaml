openapi: 3.0.3
info:
  title: Self-Hardening Governance — Adjudication API (Demo)
  description: |
    Phase 11D/12B thin HTTP façade over the Governor adjudication path.
    **Demo.** LOOSEN/DISABLE never auto-approve.

    Authentication (all optional; with none configured every endpoint is open, loopback only):
    - `ADJUDICATION_TOKEN`: one shared token. Every endpoint except a minimal `GET /health`
      requires it (`Authorization: Bearer <token>` or `X-Adjudication-Token`). `operator_id`
      in the request body is then self-asserted and required on `/decide`.
    - `ADJUDICATION_OPERATOR_TOKENS=alice=tokA,bob=tokB`: one token per operator. The
      operator is taken from the credential; a different `operator_id` in the body is a 403.
      Once any operator token exists, the shared token can no longer decide (403), and the
      operator is also authenticated inside the governor's `OperatorRegistry`.
    - `ADJUDICATION_AUDIT_LOG=<path>`: write the hash-chained audit log to this file.

    Errors are JSON `{"error": "..."}`: 400 invalid input (bad JSON, missing field, non-finite
    or non-positive number, bad decision, wrong state), 401 missing or wrong token, 403
    operator mismatch or refused by the authority, 404 unknown boundary or proposal, 409
    boundary already exists, 413 body over 1 MB, 500 internal error.
  version: "0.1.0"
servers:
  - url: http://127.0.0.1:8765
    description: Local demo server (`python scripts/adjudication_server.py`)
paths:
  /health:
    get:
      summary: Liveness; governor status counters are included only for an authenticated caller
      responses:
        "200":
          description: OK
  /audit:
    get:
      summary: Audit-log head hash, length, and whether the hash chain verifies (authenticated)
      description: |
        `chain_intact` false (with `problem` naming the first bad entry) means a past entry was
        edited, removed or reordered. It cannot detect a full rewrite unless you compare `head`
        and `length` with a copy you stored earlier somewhere the server cannot write.
      responses:
        "200":
          description: Chain status
  /proposals/pending:
    get:
      summary: List proposals awaiting operator decision
      responses:
        "200":
          description: Pending proposals
  /proposals/{id}/evidence:
    get:
      summary: Evidence pack for offline audit
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Evidence pack
        "404":
          description: Unknown proposal
  /proposals/{id}/decide:
    post:
      summary: Operator decision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]  # operator_id required unless per-operator tokens are used
              properties:
                decision:
                  type: string
                  enum: [approve_loosen, approve_disable, reject, approve]
                operator_id: { type: string }
                rationale: { type: string }
      responses:
        "200":
          description: Decision applied
        "200":
          description: Decision applied; status is the proposal's final status (e.g. applied)
        "400":
          description: Invalid decision, missing operator_id, or proposal not pending
        "403":
          description: operator_id does not match the credential
        "404":
          description: Unknown proposal
  /boundaries:
    post:
      summary: Create boundary (demo)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                boundary_id: { type: string }
                initial_limit: { type: number }
                resource: { type: string }
      responses:
        "200":
          description: Created
        "400":
          description: Invalid boundary_id or initial_limit (must be a finite number > 0)
        "409":
          description: Boundary already exists
  /proposals/loosen:
    post:
      summary: Create LOOSEN proposal and submit for review
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [boundary_id, proposed_value]
              properties:
                boundary_id: { type: string }
                proposed_value: { type: number }
                reason: { type: string }
      responses:
        "200":
          description: Proposal id and pending_review status
        "400":
          description: Missing boundary_id, or proposed_value not a finite number > 0
        "404":
          description: Boundary not found

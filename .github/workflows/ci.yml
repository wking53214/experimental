name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test suite
        # The two modules that need an optional package are named, not skipped: conftest.py fails the run on any
        # skip. They run in the cns and integration-dgk jobs below, where the package is installed.
        run: python -m pytest tests/ -q --tb=line --ignore=tests/test_cns_connector.py --ignore=tests/test_integration_dgk.py
      - name: Multi-seed smoke (N=3)
        run: python scripts/run_multiseed.py --seeds 3 --out results/multiseed_ci.json

  lint:
    # Pyflakes only (unused imports and variables, undefined names), selected in pyproject.toml. ruff is pinned
    # because a release can change what the default rules are; bump it on purpose.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.9
      - name: ruff check
        run: ruff check .

  cns:
    # The optional CNS connector (src/governance/cns_connector.py), with requirements-cns.txt installed.
    # EXPERIMENTAL_REQUIRE_CNS=1 turns a missing cns into a failure, so these tests cannot silently skip here.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies (with pytest) and the cns extra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-cns.txt
      - name: Run test suite with CNS present
        env:
          EXPERIMENTAL_REQUIRE_CNS: "1"
        run: python -m pytest tests/ -q --tb=short -rs --ignore=tests/test_integration_dgk.py

  integration-dgk:
    # Two pins: the stock commit (defects present, adapter must work around them) and the commit with the
    # telemetry-validation fix (4a0ecd2, now on DGK main; adapter must still behave the same). The pins do not
    # move; the integration-dgk-main job below follows DGK main.
    strategy:
      matrix:
        dgk: ["da256f314d0b80cb79a3b4652a89dea1cf60ca3d", "4a0ecd29b34e772c06f77cce977bb7c89e96442f"]
    # The adapter in integrations/dgk_governed.py is tested against the real DGK, pinned to a commit so a change
    # in that repository cannot break this one by surprise. Kept separate from the core job on purpose.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies and DGK at the pinned commit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "git+https://github.com/wking53214/DGK.git@${{ matrix.dgk }}"
      - name: DGK integration tests
        run: python -m pytest tests/test_integration_dgk.py -q --tb=short

  integration-dgk-main:
    # Follows the current DGK main, which the two pins above never see. It is allowed to fail: a red run here means
    # DGK changed under the adapter, to be read and then either fixed here or re-pinned, not a failure of this
    # repository's own code. The pinned job stays the blocking one.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies and the current DGK main
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "git+https://github.com/wking53214/DGK.git@main"
      - name: DGK integration tests against DGK main
        run: python -m pytest tests/test_integration_dgk.py -q --tb=short
